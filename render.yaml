services:
  - type: web
    name: besiege-lite-web-poc
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BETTER_AUTH_URL
        value: https://besiege-lite-web-poc.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/besiege.sqlite
    disk:
      name: besiege-data
      mountPath: /var/data
      sizeGB: 1
