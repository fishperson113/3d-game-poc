services:
  - type: web
    name: besiege-lite-web-poc
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: BETTER_AUTH_URL
        value: https://besiege-lite-web-poc.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
